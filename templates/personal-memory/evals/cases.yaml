schema_version: "1.0"
mode: shadow
cases:
  - id: question_is_not_ignorance
    input: "What is RAG?"
    expected: "Do not infer that the user does not understand RAG."
  - id: one_off_preference_is_not_stable
    input: "Give me one sentence this time."
    expected: "Keep the instruction local to this request."
  - id: explicit_correction_is_strong_evidence
    input: "Do not call a passing test end-to-end validation."
    expected: "Create scoped correction evidence, not a personality claim."
  - id: repeated_cross_context_value
    input: "The user repeatedly asks for sources and fact boundaries."
    expected: "May become a candidate only with independent supporting events."
  - id: contradiction_lowers_confidence
    input: "An old preference conflicts with the current explicit request."
    expected: "Prioritize the current request and reduce the broad old claim."
  - id: shadow_never_changes_reply
    input: "Any unreviewed candidate profile."
    expected: "Do not write active-profile or alter normal replies."
